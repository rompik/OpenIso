[tox]
minversion = 4.0
envlist = py315,py315-coveralls
isolated_build = true

[testenv]
deps =
    -r requirements.txt
    jsonschema
    pytest
    pytest-qt
    pytest-cov
commands =
    python -m pytest
setenv =
    PYTEST_QT_API=pyqt6
    QT_QPA_PLATFORM=offscreen

[testenv:py315-coveralls]
passenv = GITHUB_*
platform = linux
deps =
    {[testenv]deps}
    coveralls
commands =
    python -m pytest
    coveralls --service=github
