name: Create GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (for example: v0.8.5)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create-release:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Resolve tag and version
      id: meta
      shell: bash
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          TAG_NAME="${{ inputs.tag }}"
        else
          TAG_NAME="${GITHUB_REF_NAME}"
        fi

        if [ -z "$TAG_NAME" ]; then
          echo "Tag name is empty"
          exit 1
        fi

        VERSION="${TAG_NAME#v}"
        echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Extract release notes from changelog
      id: notes
      shell: bash
      run: |
        VERSION="${{ steps.meta.outputs.version }}"

        awk -v ver="$VERSION" '
          index($0, "## " ver) == 1 { in_section = 1; next }
          in_section && /^## / { exit }
          in_section { print }
        ' CHANGELOG.md > RELEASE_NOTES.md

        if grep -q '[^[:space:]]' RELEASE_NOTES.md; then
          echo "has_notes=true" >> "$GITHUB_OUTPUT"
        else
          echo "No changelog section for version $VERSION, fallback to autogenerated notes"
          echo "has_notes=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Create release from changelog notes
      if: steps.notes.outputs.has_notes == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.meta.outputs.tag }}
        name: OpenIso ${{ steps.meta.outputs.version }}
        body_path: RELEASE_NOTES.md
        draft: false
        prerelease: false

    - name: Create release with autogenerated notes
      if: steps.notes.outputs.has_notes != 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.meta.outputs.tag }}
        name: OpenIso ${{ steps.meta.outputs.version }}
        generate_release_notes: true
        draft: false
        prerelease: false
